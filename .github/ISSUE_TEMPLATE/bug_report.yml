name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → Updates
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: Android 15, Pixel 8
    validations:
      required: true
  - type: dropdown
    id: entry-point
    attributes:
      label: How was dictation started?
      options: [Floating button, Quick Settings tile, Volume key, Launcher icon, Widget or shortcut, Digital assistant / voice input, Share, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional `adb logcat` output. Remove server addresses and API keys first.
      render: text
