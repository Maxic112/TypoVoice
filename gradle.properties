org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# File-system watching missed edits made by the agent's tools and produced stale APKs.
org.gradle.vfs.watch=false
# GitHub repository ("owner/name") with releases for in-app updates; empty = updates not configured.
typovoice.updateRepo=Maxic112/TypoVoice
